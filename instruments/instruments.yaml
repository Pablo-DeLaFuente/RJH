# Settings for every instrument. Set enabled: true to include it in the manager.
#
# Ports are found automatically:  python -m instruments.connect
# Detected ports are saved per computer in instruments.local.yaml (not in git),
# so the laptop and the lab desktop can each have different COM numbers.
#
# match: how to recognize the instrument's USB adapter in Device Manager
#   description: text that appears in the port's name
#   vid_pid:     USB vendor:product ID (hex), e.g. "0403:6001"
# If nothing matches, drivers that support it are probed (a short query is
# sent to each unclaimed port).

# ---- run setup ---------------------------------------------------------------
# power_source picks which current source is logged:
#   bk1900b -> BK 1900B on (its own V/I readback), clamp off
#   welder  -> Fluke 374 FC clamp on, BK off. Power is computed as P = I^2 * R_total,
#              so R_total_ohm is required (measure it before the run:
#              python -m instruments.fluke_374fc.clamp_ble --measure-R).
#              Can also be given per run: python -m instruments.manager --R 1.8
#   none    -> don't touch; use each instrument's enabled: flag below
run:
  power_source: none
  R_total_ohm: null     # total circuit resistance for welder runs [ohm]

ct3:
  enabled: true
  baudrate: 115200      # confirmed with instruments.ct3.diagnose
  # min_period_ms: 10    # optional: force a slower minimum sample period
  match:
    description: ["Infrared Online Sensor Adapter"]
    vid_pid: ["10c4:834b"]   # Silicon Labs chip in the Micro-Epsilon USB adapter

fluke_e1rh:
  enabled: false
  mode: tcp           # tcp (Ethernet/PoE) or serial
  host: 192.168.0.10
  tcp_port: 502
  baudrate: 9600      # used when mode: serial
  match:
    description: []

bk1900b:
  enabled: false
  baudrate: 9600
  match:
    description: []

fluke_374fc:
  enabled: false
  ble_address: "14:9C:EF:CA:4D:39"   # FLUKE 374FC, fw V0.3.9; from: python -m instruments.fluke_374fc.discover (blank = scan each start)
  name_hint: "374"      # BLE name to look for when scanning
  connect_timeout: 45   # s to wait for the first reading on connect()
